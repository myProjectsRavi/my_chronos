name: Generate CHRONOS CLI Cargo.lock

on:
  push:
    branches:
      - cert/cargo-lock-bootstrap
    paths:
      - chronos-cli/Cargo.toml
      - chronos-cli/src/main.rs
      - .github/workflows/generate-cli-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean public lineage
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Generate canonical Cargo lockfile
        working-directory: chronos-cli
        run: cargo generate-lockfile

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronos-cli/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already canonical"
            exit 0
          fi
          git commit -m "build: generate canonical Rust CLI lockfile"
          git push origin HEAD:cert/cargo-lock-bootstrap
