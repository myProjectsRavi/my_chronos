name: Bug report
description: Report a reproducible CHRONOS defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove credentials, personal data, customer data, and private repository contents before posting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.x.y or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, installation method, and relevant optional components.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest synthetic example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: I have not included secrets, personal data, private customer/employer material, or unsanitized logs.
          required: true
        - label: This is not a vulnerability report; vulnerabilities are reported privately per SECURITY.md.
          required: true
