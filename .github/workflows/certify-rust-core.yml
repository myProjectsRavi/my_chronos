name: Certify CHRONOS Rust Core

on:
  push:
    branches:
      - cert/rust-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout clean certification branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Generate current canonical Rust core lockfile
        working-directory: chronos-core
        run: cargo generate-lockfile

      - name: Test all targets and features with canonical locked graph
        run: cargo test --manifest-path chronos-core/Cargo.toml --all-targets --all-features --locked

      - name: Strict Clippy gate
        run: cargo clippy --manifest-path chronos-core/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Commit certified canonical lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronos-core/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already canonical"
            exit 0
          fi
          git commit -m "build: generate canonical Rust core lockfile"
          git push origin HEAD:cert/rust-core
