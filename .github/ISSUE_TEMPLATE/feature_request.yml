name: Feature request
description: Propose a focused CHRONOS improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or developer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, compatibility, and performance impact
      description: Note any new trust boundary, stored data, dependency, API change, or measurable performance implication.
    validations:
      required: true
